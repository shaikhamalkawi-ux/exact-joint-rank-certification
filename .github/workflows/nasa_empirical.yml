name: nasa-empirical

on:
  push:
    branches: [nasa-empirical-extension]
    paths:
      - "scripts/nasa_battery_empirical.py"
      - ".github/workflows/nasa_empirical.yml"
  workflow_dispatch:

jobs:
  nasa-raw-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy
      - name: Run direct-from-raw NASA empirical audit
        run: python scripts/nasa_battery_empirical.py
      - name: Upload empirical audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: nasa-empirical-ejrc
          path: nasa_empirical_output/
          if-no-files-found: error
